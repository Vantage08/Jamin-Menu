<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jamin Gold — Digital QR Menu</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Playfair Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        obsidian: '#0f0f11',
                        charcoal: '#17171b',
                        gold: {
                            DEFAULT: '#d4af37',
                            light: '#f3d570',
                            dark: '#aa8822',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .bg-custom-logo {
            background-image: linear-gradient(rgba(15, 15, 17, 0.94), rgba(15, 15, 17, 0.97)), url('https://i.postimg.cc/DZksFvf5/Screenshot-20261116-175034.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .light .bg-custom-logo {
            background-image: linear-gradient(rgba(248, 250, 252, 0.93), rgba(255, 255, 255, 0.96)), url('https://i.postimg.cc/DZksFvf5/Screenshot-20261116-175034.jpg');
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .glass-card {
            background: rgba(23, 23, 27, 0.82);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.16);
        }
        .light .glass-card {
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }
        .glass-header {
            background: rgba(15, 15, 17, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .light .glass-header {
            background: rgba(255, 255, 255, 0.9);
        }
        .gold-glow {
            box-shadow: 0 4px 24px -4px rgba(212, 175, 55, 0.25);
        }
        .item-image-container {
            background-color: #ffffff !important;
        }
        .item-image-container img {
            object-fit: contain;
            width: 100%;
            height: 100%;
            padding: 8px;
        }
    </style>
</head>
<body class="bg-custom-logo min-h-screen flex flex-col antialiased selection:bg-gold selection:text-obsidian pb-32 text-slate-100 dark:text-slate-100">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 w-11/12 max-w-sm pointer-events-none"></div>

    <!-- Venue Header -->
    <header class="relative overflow-hidden pt-8 pb-6 px-4 sm:px-6 border-b border-white/10 dark:border-white/10 light:border-slate-200">
        <div class="absolute -top-24 left-1/2 -translate-x-1/2 w-96 h-48 bg-gold/15 blur-3xl rounded-full pointer-events-none"></div>
        
        <div class="max-w-3xl mx-auto relative z-10 text-center">
            <!-- Logo Preview Badge -->
            <div class="w-20 h-20 mx-auto mb-3 rounded-full overflow-hidden border-2 border-gold shadow-lg bg-charcoal">
                <img src="https://i.postimg.cc/DZksFvf5/Screenshot-20261116-175034.jpg" alt="Jamin Golden Hotel Logo" class="w-full h-full object-cover">
            </div>

            <h1 id="venue-name" class="font-serif text-3xl sm:text-4xl font-bold tracking-tight text-slate-900 dark:text-white mb-2">
                Jamin Golden Hotel
            </h1>
            <p id="venue-subtitle" class="text-sm sm:text-base text-slate-600 dark:text-slate-400 max-w-md mx-auto">
                Explore our Drinks, Kitchen delicacies, and Mini-Mart essentials.
            </p>

            <!-- Search & Filter Controls -->
            <div class="mt-6 space-y-3">
                <div class="relative max-w-lg mx-auto">
                    <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                    <input 
                        type="text" 
                        id="search-input" 
                        placeholder="Search Heineken, chocolate, snacks, water, wine..." 
                        class="w-full bg-white/80 dark:bg-charcoal/90 border border-slate-200 dark:border-white/15 focus:border-gold rounded-xl pl-10 pr-10 py-3 text-sm text-slate-900 dark:text-white placeholder-slate-500 outline-none transition shadow-sm"
                    >
                    <button id="clear-search" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white p-1">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Sticky Category Navigation Tabs -->
    <nav class="sticky top-0 z-30 glass-header border-b border-white/10 dark:border-white/10 light:border-slate-200 shadow-sm">
        <div class="max-w-3xl mx-auto px-4 flex items-center justify-between">
            <div id="category-tabs" class="flex items-center justify-start sm:justify-center gap-2 overflow-x-auto no-scrollbar py-3 flex-1">
                <!-- Populated dynamically via JS -->
            </div>
            <!-- Theme Toggle Button -->
            <button onclick="toggleTheme()" class="ml-3 p-2.5 rounded-xl bg-gold/10 hover:bg-gold/20 text-gold border border-gold/30 transition shrink-0" title="Toggle Light/Dark Theme">
                <i id="theme-icon" data-lucide="sun" class="w-4 h-4"></i>
            </button>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-3xl w-full mx-auto px-4 sm:px-6 pt-6 space-y-8">
        
        <!-- 3 Main Category Cards Overview -->
        <section id="category-cards-section">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-xs font-semibold uppercase tracking-widest text-gold">Browse Categories</h2>
                <span class="text-xs text-slate-500 dark:text-slate-400">Tap to jump</span>
            </div>
            <div id="category-cards-grid" class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <!-- Populated dynamically -->
            </div>
        </section>

        <!-- Menu Sections Container -->
        <div id="menu-sections-container" class="space-y-12">
            <!-- Populated dynamically -->
        </div>

        <!-- Empty Search State -->
        <div id="empty-state" class="hidden text-center py-12 glass-card rounded-2xl p-6">
            <div class="w-12 h-12 rounded-full bg-white/5 text-slate-400 flex items-center justify-center mx-auto mb-3">
                <i data-lucide="search-x" class="w-6 h-6"></i>
            </div>
