<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jamin Gold — Digital QR Menu</title>
  <style>
    :root {
      --bg: #0f0e0c;
      --card: #191714;
      --card-2: #221f1b;
      --gold: #d4af37;
      --gold-soft: rgba(212, 175, 55, 0.16);
      --text: #f6f2e9;
      --muted: #b5ad9c;
      --border: rgba(212, 175, 55, 0.24);
      --danger: #e05a47;
      --success: #38b778;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      padding-bottom: 110px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(15, 14, 12, 0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 820px;
      margin: 0 auto;
    }

    .brand-logo {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      background: var(--card-2);
      display: grid;
      place-items: center;
      font-weight: 800;
      color: var(--gold);
      font-size: 16px;
      flex-shrink: 0;
    }

    .brand h1 {
      font-size: 18px;
      letter-spacing: 0.4px;
      color: var(--gold);
    }

    .brand p {
      font-size: 12px;
      color: var(--muted);
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 14px 16px;
    }

    .search-box {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 14px;
      margin-bottom: 12px;
      outline: none;
    }

    .search-box:focus {
      border-color: var(--gold);
    }

    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .tab.active {
      background: var(--gold);
      color: #14110b;
      border-color: var(--gold);
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
    }

    .item-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }

    .item-cat {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--gold);
      margin-bottom: 4px;
    }

    .item-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }

    .item-price {
      font-size: 15px;
      font-weight: 700;
      color: var(--gold);
      margin-top: 4px;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn-qty {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-qty.add {
      background: var(--gold);
      color: #14110b;
      border-color: var(--gold);
    }

    .qty-val {
      min-width: 22px;
      text-align: center;
      font-weight: 700;
      font-size: 14px;
    }

    .cart-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      background: #171511;
      border-top: 1px solid var(--border);
      padding: 12px 16px;
    }

    .cart-inner {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .cart-summary strong {
      display: block;
      font-size: 15px;
      color: var(--gold);
    }

    .cart-summary span {
      font-size: 12px;
      color: var(--muted);
    }

    .btn-primary {
      background: var(--gold);
      color: #14110b;
      border: none;
      border-radius: 10px;
      padding: 11px 16px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.78);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      width: 100%;
      max-width: 460px;
      max-height: 90vh;
      overflow-y: auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .modal-header h2 {
      font-size: 17px;
      color: var(--gold);
    }

    .btn-close {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 22px;
      cursor: pointer;
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .field input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      font-size: 14px;
    }

    .order-lines {
      border-top: 1px dashed var(--border);
      border-bottom: 1px dashed var(--border);
      padding: 10px 0;
      margin: 12px 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
    }

    .order-line {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      font-weight: 800;
      font-size: 16px;
      color: var(--gold);
      margin-bottom: 14px;
    }

    .receipt-box {
      background: #fffdf7;
      color: #18150f;
      border-radius: 14px;
      padding: 18px 16px;
      text-align: center;
      border: 2px solid var(--gold);
    }

    .receipt-logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 8px;
      border-radius: 50%;
      border: 2px solid #b88b1e;
      background: #17140e;
      color: #e6be45;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 18px;
    }

    .receipt-badge {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .badge-ok {
      background: rgba(56, 183, 120, 0.16);
      color: #167a49;
    }

    .badge-bad {
      background: rgba(224, 90, 71, 0.16);
      color: #a82b1b;
    }

    .receipt-meta {
      text-align: left;
      font-size: 12px;
      color: #4b4333;
      margin: 12px 0;
      padding: 10px;
      background: #f6f1e2;
      border-radius: 8px;
    }

    .receipt-items {
      text-align: left;
      border-top: 1px dashed #c8b88a;
      border-bottom: 1px dashed #c8b88a;
      padding: 10px 0;
      margin: 10px 0;
      font-size: 13px;
    }

    .receipt-total {
      display: flex;
      justify-content: space-between;
      font-weight: 800;
      font-size: 16px;
      color: #18150f;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-logo">JG</div>
      <div>
        <h1>Jamin Gold — Digital QR Menu</h1>
        <p>Jamin Golden Hotel • Instant WhatsApp Ordering</p>
      </div>
    </div>
  </header>

  <main class="container">
    <input id="searchInput" class="search-box" type="search" placeholder="Search menu (e.g., Heineken, yam, chocolate)..." />
    <div id="categoryTabs" class="tabs"></div>
    <div id="menuGrid" class="menu-grid"></div>
  </main>

  <div class="cart-bar">
    <div class="cart-inner">
      <div class="cart-summary">
        <strong id="cartTotalText">₦0</strong>
        <span id="cartCountText">0 items selected</span>
      </div>
      <button id="reviewOrderBtn" class="btn-primary" disabled>Review Order</button>
    </div>
  </div>

  <!-- Order Review Modal -->
  <div id="orderModal" class="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <h2>Confirm Your Order</h2>
        <button id="closeOrderModal" class="btn-close" aria-label="Close">&times;</button>
      </div>
      <div class="field">
        <label for="roomInput">Table or Room Number (Optional)</label>
        <input id="roomInput" type="text" placeholder="e.g., Room 201 or Poolside" />
      </div>
      <div id="orderLines" class="order-lines"></div>
      <div class="total-row">
        <span>Estimated Total</span>
        <span id="modalTotal">₦0</span>
      </div>
      <button id="whatsappOrderBtn" class="btn-primary" style="width:100%;">Order via WhatsApp</button>
    </div>
  </div>

  <!-- Verified Locked Receipt Modal -->
  <div id="receiptModal" class="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <h2>Official Receipt</h2>
        <button id="closeReceiptModal" class="btn-close" aria-label="Close">&times;</button>
      </div>
      <div id="receiptContent" class="receipt-box"></div>
    </div>
  </div>

  <script>
    const WHATSAPP_NUMBER = "2349026263015";
    const OFFICIAL_BASE_URL = "https://jamingoldenhotel.com.ng/";
    const RECEIPT_SALT = "JGH_2026_LOCK_KEY";

    const MENU_ITEMS = [
      { id: "b1", name: "Heineken", category: "Drinks", price: 2500 },
      { id: "b2", name: "Big Stout", category: "Drinks", price: 2500 },
      { id: "b3", name: "Budweiser", category: "Drinks", price: 2500 },
      { id: "k1", name: "Boiled or fried yam served with egg sauce", category: "Kitchen", price: 4000 },
      { id: "k18", name: "Big shortbread", category: "Mini-Mart", price: 3500 },
      { id: "m2", name: "Chocolate bar", category: "Mini-Mart", price: 2000 }
    ];

    const CATEGORIES = ["All", "Drinks", "Kitchen", "Mini-Mart"];
    let activeCategory = "All";
    let searchQuery = "";
    const cart = {};

    const formatNaira = (amount) => "₦" + Number(amount || 0).toLocaleString("en-NG");

    function renderTabs() {
      const tabsEl = document.getElementById("categoryTabs");
      tabsEl.innerHTML = CATEGORIES.map(cat =>
        `<button class="tab ${cat === activeCategory ? "active" : ""}" data-cat="${cat}">${cat}</button>`
      ).join("");
      tabsEl.querySelectorAll(".tab").forEach(btn => {
        btn.addEventListener("click", () => {
          activeCategory = btn.dataset.cat;
          renderTabs();
          renderMenu();
        });
      });
    }

    function renderMenu() {
      const grid = document.getElementById("menuGrid");
      const q = searchQuery.trim().toLowerCase();
      const filtered = MENU_ITEMS.filter(item => {
        const matchesCat = activeCategory === "All" || item.category === activeCategory;
        const matchesSearch = !q || item.name.toLowerCase().includes(q) || item.category.toLowerCase().includes(q);
        return matchesCat && matchesSearch;
      });

      grid.innerHTML = filtered.map(item => {
        const qty = cart[item.id] || 0;
        return `
          <div class="item-card">
            <div>
              <div class="item-cat">${item.category}</div>
              <div class="item-name">${item.name}</div>
              <div class="item-price">${formatNaira(item.price)}</div>
            </div>
            <div class="qty-controls">
              <button class="btn-qty" data-action="dec" data-id="${item.id}">&minus;</button>
              <span class="qty-val">${qty}</span>
              <button class="btn-qty add" data-action="inc" data-id="${item.id}">+</button>
            </div>
          </div>
        `;
      }).join("");

      grid.querySelectorAll(".btn-qty").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.dataset.id;
          const current = cart[id] || 0;
          if (btn.dataset.action === "inc") {
            cart[id] = current + 1;
          } else if (current > 0) {
            cart[id] = current - 1;
            if (cart[id] === 0) delete cart[id];
          }
          renderMenu();
          updateCartBar();
        });
      });
    }

    function getCartSummary() {
      let total = 0;
      let count = 0;
      const lines = [];
      for (const [id, qty] of Object.entries(cart)) {
        const item = MENU_ITEMS.find(m => m.id === id);
        if (item && qty > 0) {
          const lineTotal = item.price * qty;
          total += lineTotal;
          count += qty;
          lines.push({ ...item, qty, lineTotal });
        }
      }
      return { total, count, lines };
    }

    function updateCartBar() {
      const { total, count } = getCartSummary();
      document.getElementById("cartTotalText").textContent = formatNaira(total);
      document.getElementById("cartCountText").textContent = `${count} ${count === 1 ? "item" : "items"} selected`;
      document.getElementById("reviewOrderBtn").disabled = count === 0;
    }

    function computeShortSig(payload) {
      let hash = 2166136261;
      const str = `${payload}|${RECEIPT_SALT}`;
      for (let i = 0; i < str.length; i++) {
        hash ^= str.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }
      return (hash >>> 0).toString(36).toUpperCase().slice(0, 6);
    }

    function buildShortReceiptUrl(orderNum, room, codeTime, itemsPart) {
      const cleanRoom = (room || "Not_specified").trim().replace(/\s+/g, "_").replace(/[~]/g, "");
      const payload = `${orderNum}~${cleanRoom}~${codeTime}~${itemsPart}`;
      const sig = computeShortSig(payload);
      const base = window.location.protocol.startsWith("http") && !window.location.hostname.includes("github.io")
        ? `${window.location.origin}${window.location.pathname.replace(/index\.html$/, "")}`
        : OFFICIAL_BASE_URL;
      const normalizedBase = base.endsWith("/") ? base : `${base}/`;
      return `${normalizedBase}?r=${encodeURIComponent(`${payload}~${sig}`)}`;
    }

    function openOrderModal() {
      const { total, lines } = getCartSummary();
      document.getElementById("orderLines").innerHTML = lines.map(l =>
        `<div class="order-line"><span>${l.qty}x ${l.name} (${formatNaira(l.price)})</span><strong>${formatNaira(l.lineTotal)}</strong></div>`
      ).join("");
      document.getElementById("modalTotal").textContent = formatNaira(total);
      document.getElementById("orderModal").classList.add("open");
    }

    function sendOrderWhatsApp() {
      const { total, lines } = getCartSummary();
      if (!lines.length) return;

      const roomRaw = document.getElementById("roomInput").value.trim();
      const orderNum = String(Math.floor(1000 + Math.random() * 9000));
      const now = new Date();
      const codeTime = `${String(now.getHours()).padStart(2, "0")}${String(now.getMinutes()).padStart(2, "0")}${String(now.getSeconds()).padStart(2, "0")}`;
      const itemsPart = lines.map(l => `${l.id}.${l.qty}`).join("-");
      const receiptUrl = buildShortReceiptUrl(orderNum, roomRaw, codeTime, itemsPart);

      const itemBulletLines = lines.map(l => `• ${l.qty}x ${l.name} (${formatNaira(l.price)})`).join("\n");
      const msg = [
        "NEW ORDER — JAMIN GOLDEN HOTEL",
        `Order ID: JGH-${orderNum}`,
        `Table / Room: ${roomRaw || "Not specified"}`,
        "------------------------------",
        itemBulletLines,
        "------------------------------",
        `ESTIMATED TOTAL: ${formatNaira(total)}`,
        "",
        "🔒 Tap to View Official Locked Receipt:",
        receiptUrl
      ].join("\n");

      const waUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
      window.open(waUrl, "_blank", "noopener,noreferrer");
    }

    function renderReceiptFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const raw = params.get("r");
      if (!raw) return;

      const parts = raw.split("~");
      const box = document.getElementById("receiptContent");
      document.getElementById("receiptModal").classList.add("open");

      if (parts.length !== 5) {
        box.innerHTML = `
          <div class="receipt-logo">JG</div>
          <h3>Jamin Golden Hotel</h3>
          <span class="receipt-badge badge-bad">INVALID OR TAMPERED RECEIPT</span>
          <p style="margin-top:10px;font-size:13px;">This receipt link is incomplete or has been modified.</p>
        `;
        return;
      }

      const [orderNum, roomEncoded, codeTime, itemsPart, sig] = parts;
      const payload = `${orderNum}~${roomEncoded}~${codeTime}~${itemsPart}`;
      const expectedSig = computeShortSig(payload);
      const isValid = sig === expectedSig;

      const parsedItems = (itemsPart || "").split("-").map(pair => {
        const [id, qtyStr] = pair.split(".");
        const qty = Math.max(1, parseInt(qtyStr, 10) || 1);
        const menuItem = MENU_ITEMS.find(m => m.id === id);
        if (!menuItem) return null;
        return { ...menuItem, qty, lineTotal: menuItem.price * qty };
      }).filter(Boolean);

      const total = parsedItems.reduce((sum, i) => sum + i.lineTotal, 0);
      const roomDisplay = (roomEncoded || "Not specified").replace(/_/g, " ");
      const timeFormatted = /^\d{6}$/.test(codeTime)
        ? `${codeTime.slice(0, 2)}:${codeTime.slice(2, 4)}:${codeTime.slice(4, 6)}`
        : codeTime;

      box.innerHTML = `
        <div class="receipt-logo">JG</div>
        <h3>Jamin Golden Hotel</h3>
        <div style="font-size:12px;color:#6b5d42;">Official Digital Menu Receipt</div>
        <span class="receipt-badge ${isValid ? "badge-ok" : "badge-bad"}">
          ${isValid ? "✓ VERIFIED LOCKED RECEIPT" : "⚠ SIGNATURE MISMATCH — TAMPERED"}
        </span>
        <div class="receipt-meta">
          <div><strong>Order ID:</strong> JGH-${orderNum}</div>
          <div><strong>Table / Room:</strong> ${roomDisplay}</div>
          <div><strong>Time Code:</strong> ${timeFormatted}</div>
        </div>
        <div class="receipt-items">
          ${parsedItems.length
            ? parsedItems.map(i => `<div class="order-line"><span>${i.qty}x ${i.name} (${formatNaira(i.price)})</span><strong>${formatNaira(i.lineTotal)}</strong></div>`).join("")
            : "<div>No recognized items</div>"}
        </div>
        <div class="receipt-total">
          <span>TOTAL</span>
          <span>${formatNaira(total)}</span>
        </div>
      `;
    }

    document.getElementById("searchInput").addEventListener("input", (e) => {
      searchQuery = e.target.value;
      renderMenu();
    });

    document.getElementById("reviewOrderBtn").addEventListener("click", openOrderModal);
    document.getElementById("closeOrderModal").addEventListener("click", () => {
      document.getElementById("orderModal").classList.remove("open");
    });
    document.getElementById("closeReceiptModal").addEventListener("click", () => {
      document.getElementById("receiptModal").classList.remove("open");
    });
    document.getElementById("whatsappOrderBtn").addEventListener("click", sendOrderWhatsApp);

    renderTabs();
    renderMenu();
    updateCartBar();
    renderReceiptFromUrl();
  </script>
</body>
</html>
